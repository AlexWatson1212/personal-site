# The QA harness gates production. `test:site` is build + scripts/qa.mjs, which
# exits non-zero on any failure, so a commit that breaks a price, reintroduces a
# retired offer name, claims the legal wording is approved, or leaves an internal
# note in the published output fails the deploy instead of reaching the public
# site. Every commit on main deploys, including automated ones — this is the only
# thing standing between a half-finished edit and a live page.
[build]
  command = "npm run test:site"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.2.2"
  NODE_VERSION = "22"

# ─────────────────────────────────────────────────────────────────────────────
# One hostname.
#
# www.alexanderwatson.co.uk currently serves the site rather than redirecting
# to it, so the same page is reachable at two hostnames. Every page already
# declares an apex canonical, which is what has kept this from splitting the
# site in search — but a canonical is a hint and a redirect is not, and the two
# hostnames are also two sets of analytics figures and two cookie scopes.
#
# force = true so it wins over the plain file serve. The apex is the canonical
# host because that is what every canonical, the sitemap and site.url already
# say. Setting the primary domain in Netlify's own domain settings does the
# same job; this lives in the repository so the decision is reviewable.
# ─────────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "https://www.alexanderwatson.co.uk/*"
  to = "https://alexanderwatson.co.uk/:splat"
  status = 301
  force = true

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/documents/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
    X-Content-Type-Options = "nosniff"

# Published case-study documents. Same cache policy as /assets/documents/:
# long enough to be cheap, short enough that a corrected edition reaches
# people without a filename change.
[[headers]]
  for = "/assets/practice-clarity/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"

# ─────────────────────────────────────────────────────────────────────────────
# Purchase-complete page, the retired questionnaire route and the client pages.
#
# Both already carry <meta name="robots" content="noindex, nofollow"> and
# sitemap: false. These headers are the second lock: they keep the pages out of
# search results even if a meta tag is lost in a future template change.
# ─────────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/purchase-complete/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/services/practice-website/questionnaire/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# The private client pages: the Practice Discovery questionnaire, its
# confirmation page and the printable photography brief. Same two locks as
# above. no-referrer keeps anything in a page address out of the Referer header
# the page's links would otherwise send.
[[headers]]
  for = "/client/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

# ─────────────────────────────────────────────────────────────────────────────
# Content Security Policy.
#
# Shipped in report-only form first, deliberately. The Practice Clarity guides
# contain inline <script> blocks and the purchase page carries inline JSON-LD,
# so an enforcing policy without 'unsafe-inline' would break those pages today.
# Watch the violation reports, move the remaining inline scripts into files,
# then rename the header to Content-Security-Policy.
#
# frame-src is 'none'. It allowed https://tally.so until 19 September 2026, for
# the embedded Tally intake on /client/intake/. That intake was retired and
# replaced by Practice Discovery, a native form on this site, so no page frames
# a third party any more and the allowance was removed rather than left open.
# Do not add a host back without a page that needs it.
#
# Note what is NOT here: no Stripe script or frame permission. Stripe checkout
# is reached by an ordinary link to a Stripe-hosted page — a top-level
# navigation, which needs no CSP allowance. Do not add script-src or frame-src
# entries for Stripe unless the implementation changes to an embedded checkout,
# which would be a different review.
# ─────────────────────────────────────────────────────────────────────────────
# The cookieless `provider` in _config.yml is still OFF, and no host is allowed
# for it. If it is ever switched on, its script host must be permitted in BOTH
# script-src and connect-src or the beacon is blocked:
#
#   script-src 'self' 'unsafe-inline' https://PROVIDER_HOST;
#   connect-src 'self' https://PROVIDER_HOST;
#
# Google Analytics 4 IS configured (analytics.ga4_measurement_id), so its hosts
# are permitted below. Three directives, because GA4 uses three transports:
#
#   script-src   www.googletagmanager.com   gtag.js itself.
#   connect-src  *.google-analytics.com     the measurement beacon, which is a
#                *.analytics.google.com     fetch/XHR to a region-specific host
#                www.googletagmanager.com   — the wildcards are required.
#   img-src      *.google-analytics.com     the pixel fallback, used when a
#                www.google-analytics.com   beacon cannot be sent.
#
# Nothing here loads anything. A visitor who has not allowed analytics never
# reaches any of these hosts, because assets/js/analytics-consent.js does not
# inject gtag.js until they have. The policy permits the requests; consent is
# what causes them.
#
# Deliberately absent: google.com and googleadservices.com. Google Signals and
# ads personalisation are not used, and leaving those hosts out means a change
# that switched them on would show up as a CSP report rather than silently
# working.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://www.google-analytics.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; form-action 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
