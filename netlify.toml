[build]
  command = "bundle exec jekyll build --trace"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.2.2"

# Legacy pages → current site structure

[[redirects]]
  from = "/library"
  to = "/practice-clarity"
  status = 301
  force = true

[[redirects]]
  from = "/professional-identity"
  to = "/service/"
  status = 301
  force = true

[[redirects]]
  from = "/practice-clarity/counselling-directory-profile"
  to = "/beyond-counselling-directory/"
  status = 301
  force = true

