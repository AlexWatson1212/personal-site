<header class="site-header" role="banner">
  <nav
    class="nav"
    role="navigation"
    aria-label="Main navigation"
  >

    <a
      class="nav__brand"
      href="{{ '/' | relative_url }}"
      aria-label="Alexander Watson — Home"
    >
      <img
        class="nav__logo"
        src="{{ '/assets/images/brand/Alexander-Watson-Alternate-logo.svg' | relative_url }}"
        alt=""
        width="180"
        height="45"
        decoding="async"
      >
    </a>

    <button
      class="nav__toggle"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="primary-nav-panel"
    >
      <span class="nav__hamburger" aria-hidden="true"></span>
    </button>

    <div class="nav__overlay" aria-hidden="true"></div>

    <div
      id="primary-nav-panel"
      class="nav__panel"
    >
      <ul
        id="primary-nav"
        class="nav__links"
      >
        <li>
          <a
            href="{{ '/' | relative_url }}"
            {% if page.url == '/' %}aria-current="page"{% endif %}
          >
            Home
          </a>
        </li>

        <li>
          <a
            href="{{ '/service/' | relative_url }}"
            {% if page.url == '/service/' %}aria-current="page"{% endif %}
          >
            Service
          </a>
        </li>

        <li>
          <a href="{{ '/#work' | relative_url }}">
            Work
          </a>
        </li>

        <li class="nav__library">
          <details
            {% if page.url == '/library/' or page.url == '/blog/' or page.layout == 'guide' or page.layout == 'post' %}
              data-current="true"
            {% endif %}
          >
            <summary>
              Library
              <span class="nav__library-chevron" aria-hidden="true"></span>
            </summary>

            <ul class="nav__subnav">
              <li>
                <a
                  href="{{ '/library/' | relative_url }}"
                  {% if page.url == '/library/' or page.layout == 'guide' %}aria-current="page"{% endif %}
                >
                  Practice Clarity Guides
                </a>
              </li>

              <li>
                <a
                  href="{{ '/blog/' | relative_url }}"
                  {% if page.url == '/blog/' or page.layout == 'post' %}aria-current="page"{% endif %}
                >
                  Blog posts
                </a>
              </li>
            </ul>
          </details>
        </li>

        <li>
          <a
            href="{{ '/about/' | relative_url }}"
            {% if page.url == '/about/' %}aria-current="page"{% endif %}
          >
            About
          </a>
        </li>
      </ul>

      <a
        class="nav__cta"
        href="{{ '/contact/' | relative_url }}"
        {% if page.url == '/contact/' %}aria-current="page"{% endif %}
      >
        Apply for a founding place
      </a>
    </div>

  </nav>
</header>
