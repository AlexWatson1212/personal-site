title: "Alexander Watson"
brand: "Alexander Watson Studio"
# Used as the fallback meta description, and as the organisation description in
# the ProfessionalService schema. Kept under 160 characters so a search result
# shows all of it, and deliberately free of prices: those live in
# _data/purchasing.yml, and closing the founding offer must stay one edit.
description: "Website design for therapists and counsellors in UK private practice. The practice is worked out first; the website is built from it."

url: "https://alexanderwatson.co.uk"
baseurl: ""

lang: en-GB
timezone: Europe/London

# ─────────────────────────────────────────────────────────────────────────────
# ONLINE PURCHASING
#
# Nothing about Stripe is configured in this file.
#
#   _data/purchasing.yml            committed, safe defaults, prices and the
#                                   URLs the purchase journey links to.
#   _data/purchasing_resolved.yml   generated at build time by
#                                   scripts/purchasing-config.mjs from
#                                   environment variables. Never committed.
#
# Purchasing is OFF unless PUBLIC_PURCHASES_ENABLED=true and a valid live
# Payment Link is present in the environment. See STRIPE_SETUP.md.
#
# NEVER put a Stripe secret or restricted key (sk_live_…, sk_test_…, rk_…,
# whsec_…) in this repository. Everything here is public front-end code.
# ─────────────────────────────────────────────────────────────────────────────

markdown: kramdown

kramdown:
  input: GFM

future: true

permalink: /:title/

collections:
  guides:
    output: true
    permalink: /guides/:name/

plugins:
  - jekyll-sitemap

include:
  - _redirects
  - _pages

defaults:
  -
    scope:
      path: ""
    values:
      image: "/assets/images/service/alexander-watson-counselling-case-study.webp"

  -
    scope:
      path: ""
      type: "guides"
    values:
      layout: guide
      category: "Practice Clarity"
      image: "/assets/images/service/alexander-watson-counselling-case-study.webp"

# ─────────────────────────────────────────────────────────────────────────────
# Analytics. OFF until both provider and domain are set — see
# _includes/analytics.html and IMPLEMENTATION.md. While these are empty the site
# loads no third-party script and makes no external request of any kind.
# ─────────────────────────────────────────────────────────────────────────────
analytics:
  provider: ""   # "plausible" is the only implemented provider
  domain: ""     # the site domain as registered with the provider
  host: ""       # the provider's script host, e.g. plausible.io

  # ───────────────────────────────────────────────────────────────────────────
  # Google Analytics 4.
  #
  # Separate from `provider` above, which stays empty: Plausible and GA4 are
  # different propositions, and the guard that keeps Plausible off is not the
  # guard that governs this. Only one of the two should ever be filled in.
  #
  # GA4 is cookie-based, so unlike the cookieless provider above it cannot be
  # switched on unilaterally for a UK audience. Nothing from Google is
  # requested until a visitor has actively allowed it — see
  # assets/js/analytics-consent.js, and the "Cookies and analytics" section of
  # /privacy/, which has to stay true to whatever is set here.
  #
  # Empty this string to remove analytics completely: no measurement ID means
  # no consent notice, no preference control, no script, nothing.
  ga4_measurement_id: "G-49F892QLNC"

  # The hostnames this property is allowed to measure. A visit is only ever
  # reported from one of these, so localhost, `jekyll serve`, the Node preview
  # renderer, Netlify deploy previews and branch deploys are all inert even
  # with consent stored in the browser. This is the production guard; it is
  # expressed here rather than at build time so that it cannot be defeated by
  # a build that skipped a step.
  ga4_hosts:
    - alexanderwatson.co.uk
    - www.alexanderwatson.co.uk

# ─────────────────────────────────────────────────────────────────────────────
# READING OPTIONS
#
# The studio's display control: text size, and a reading mode. The standard is
# docs/reading-control-standard.md; the component is _shared/reading-options/.
#
#   enabled: true   →  the control is built into the footer, the pre-paint
#                      snippet and the component script are loaded, and the
#                      two reading modes in section 22 of studio.css become
#                      reachable.
#   enabled: false  →  nothing renders, no script is requested, no space is
#                      reserved, and every page is byte-for-byte the page it
#                      was before the capability existed.
#
# Off on this site. Per the standard, real client sites carry it on by default
# and concepts carry it off; the studio's own site is neither, and the approved
# design is what a visitor should meet unless the studio decides otherwise.
# Switching it on is this one word plus `npm run build`.
# ─────────────────────────────────────────────────────────────────────────────
accessibilityPreferences:
  enabled: false
  label: "Reading options"
  storageKey: "aw-studio:reading"

exclude:
  # Concept websites and the shared components they draw on. These are
  # separate deployments served from their own subdomains, kept here so
  # they are versioned with the studio rather than loose on a laptop.
  # They are not studio source and must not be built into this site.
  - _concepts
  - _shared
  - _deploy
  - README.md
  - DECISION-REGISTER.md
  - VISUAL-SYSTEM.md
  - IMPLEMENTATION.md
  - STRIPE_SETUP.md
  - LEGAL_REVIEW.md
  - OPEN_DECISIONS.md
  - REBUILD-REPORT.md
  - REDESIGN-REPORT.md
  - REFINEMENT-CHANGELOG.md
  - OFFER-RESOLUTION-CHANGELOG.md
  - LEGAL-INFORMATION-REQUIRED.md
  - PRE-LAUNCH-CHANGELOG.md
  - TRUST-ARCHITECTURE-REVIEW.md
  - MINIMAL-LAUNCH-V2.md
  - LEGAL-REVIEW-PACK.md
  - DIRECTION-NOTE-TEMPLATE.md
  - CONCEPT-PUBLICATION-ASSESSMENT.md
  - POST-LAUNCH.md
  - scripts
  - PHOTOGRAPHY-SHOT-LIST.md
  - INSTALLATION.md
  - Gemfile
  - Gemfile.lock
  - netlify.toml
  - node_modules
  - vendor
  - .bundle
  - .jekyll-cache
  - _site
  - _preview
  - _transfer
  - assets/images/image-library
  - APPLY-two-routes.txt
  - APPLY-refinement.txt
  - package.json
  - package-lock.json

  # Internal documentation. Never published.
  - docs

  # Internal strategy, client blueprints and market evidence. Never published.
  - _strategy

  # Working directories: superseded files, QA output and staging copies.
  - _to_delete
  - _responsive-pass
  - staging

  # Screenshots saved out of a working session. Not part of the site, and
  # without this line Jekyll copies the whole folder into _site and serves it.
  - Claude outputs

  # Legacy pages retained for reference only.
  - legacy
  - _legacy
