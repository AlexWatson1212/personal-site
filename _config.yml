title: "Alexander Watson"
brand: "Alexander Watson Studio"
description: "Original website design for UK therapists and counsellors. Choose a complete design direction from the collection and have it tailored to your practice for £995, including the first year of Website Care."

url: "https://alexanderwatson.co.uk"
baseurl: ""

lang: en-GB
timezone: Europe/London

# ─────────────────────────────────────────────────────────────────────────────
# ONLINE PURCHASING
#
# Nothing about Stripe is configured in this file.
#
#   _data/purchasing.yml            committed, safe defaults, prices and the
#                                   URLs the purchase journey links to.
#   _data/purchasing_resolved.yml   generated at build time by
#                                   scripts/purchasing-config.mjs from
#                                   environment variables. Never committed.
#
# Purchasing is OFF unless PUBLIC_PURCHASES_ENABLED=true and a valid live
# Payment Link is present in the environment. See STRIPE_SETUP.md.
#
# NEVER put a Stripe secret or restricted key (sk_live_…, sk_test_…, rk_…,
# whsec_…) in this repository. Everything here is public front-end code.
# ─────────────────────────────────────────────────────────────────────────────

markdown: kramdown

kramdown:
  input: GFM

future: true

permalink: /:title/

collections:
  guides:
    output: true
    permalink: /guides/:name/

plugins:
  - jekyll-sitemap

include:
  - _redirects
  - _pages

defaults:
  -
    scope:
      path: ""
    values:
      image: "/assets/images/service/alexander-watson-counselling-case-study.webp"

  -
    scope:
      path: ""
      type: "guides"
    values:
      layout: guide
      category: "Practice Clarity"
      image: "/assets/images/service/alexander-watson-counselling-case-study.webp"

# ─────────────────────────────────────────────────────────────────────────────
# Analytics. OFF until both provider and domain are set — see
# _includes/analytics.html and IMPLEMENTATION.md. While these are empty the site
# loads no third-party script and makes no external request of any kind.
# ─────────────────────────────────────────────────────────────────────────────
analytics:
  provider: ""   # "plausible" is the only implemented provider
  domain: ""     # the site domain as registered with the provider
  host: ""       # the provider's script host, e.g. plausible.io

exclude:
  - README.md
  - VISUAL-SYSTEM.md
  - IMPLEMENTATION.md
  - STRIPE_SETUP.md
  - LEGAL_REVIEW.md
  - OPEN_DECISIONS.md
  - REBUILD-REPORT.md
  - REDESIGN-REPORT.md
  - REFINEMENT-CHANGELOG.md
  - OFFER-RESOLUTION-CHANGELOG.md
  - LEGAL-INFORMATION-REQUIRED.md
  - PRE-LAUNCH-CHANGELOG.md
  - scripts
  - PHOTOGRAPHY-SHOT-LIST.md
  - INSTALLATION.md
  - Gemfile
  - Gemfile.lock
  - netlify.toml
  - node_modules
  - vendor
  - .bundle
  - .jekyll-cache
  - _site
  - _preview
  - _transfer
  - assets/images/image-library
  - APPLY-two-routes.txt
  - APPLY-refinement.txt
  - package.json
  - package-lock.json

  # Legacy pages retained for reference only.
  - legacy
  - _legacy
