# ─────────────────────────────────────────────────────────────────────────────
# The Practice Fundamentals intake — configuration.
#
# 17 September 2026. The intake is a Tally form, built by hand from
# docs/operations/tally-intake-build-spec.md, which in turn follows the approved
# source: docs/operations/practice-fundamentals-intake-system.md.
#
# The website only hosts the private page that opens it: /client/intake/
# (unlisted, noindex, nofollow, out of the sitemap, disallowed in robots.txt and
# sent with an X-Robots-Tag header by netlify.toml). The earlier 16-question
# Website Content Questionnaire, which assembled an email in the browser, was
# retired on the same date and its route now redirects to /client/intake/.
# Its page and script are kept, unpublished, under _legacy/.
#
# ONE VALUE TO SET: tally_url.
#
#   Paste the form's public share link exactly as Tally gives it, in the form
#     https://tally.so/r/abc123
#   (Tally → your form → Share → "Share link" → Copy).
#
#   While it is empty, /client/intake/ shows a calm "not connected yet" notice
#   with the studio email address, and no embed and no button render.
#
#   With a tally.so/r/ link, the page embeds the form and shows a button that
#   opens it in a new tab. Any other https address (for example a Tally custom
#   domain) shows the button only, because the embed address cannot be derived
#   from it safely.
#
#   The project reference travels in the link Alexander sends:
#     https://alexanderwatson.co.uk/client/intake/?ref=AW-001
#   The page accepts only the shape AW- followed by three or four digits, and
#   passes it to the form's hidden field "ref". Nothing else is ever put in the
#   address — no name, no email.
# ─────────────────────────────────────────────────────────────────────────────
tally_url: ""

# The form's name as the client sees it, used as the embed's accessible title.
form_title: "Practice Fundamentals intake"

# Shape accepted for ?ref=. Kept here so the page script and the build
# specification describe the same thing. The script enforces it.
ref_pattern: "^AW-[0-9]{3,4}$"
