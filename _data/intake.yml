# Website Content Questionnaire status.
#
# The 15/7 shape came from a brief describing an approved intake that was never
# found in the project. In September 2026 the studio stopped designing the
# questionnaire around that reconstructed count and made six structural changes
# instead:
#
#   1. Q5 asks what a visitor needs to find, understand or do. The client is
#      never asked to design the page structure or the menu order — that is the
#      work they are paying for.
#   2. The Stripe-era "email address used for payment" field was deleted.
#      Billing details are collected in the acceptance exchange, before the
#      first invoice.
#   3. The hosting-after-launch question was removed. The first year of Website
#      Care is included, and clause 12 already commits the studio to asking
#      before the twelve months are up.
#   4. Domain ownership and access is required, with an explicit route for a
#      client who does not have a domain yet.
#   5. The counts below follow the questionnaire. The questionnaire does not
#      follow the counts.
#   6. The payment position is stated once, near the top.
#
# questionnaire_approved: false → the page shows a draft notice.
# questionnaire_approved: true  → the notice disappears everywhere at once.
