  note: >-
    A fictional integrative relational counsellor in Bristol. The site removes
    the preconditions people invent before counselling feels legitimate, then
    argues that the unprepared account is the more useful material to start
    from.
  tags: [One therapist, Domestic photography, Plum and apricot]
  shot: /assets/images/work/maya-bennett-website.webp
  alt: >-
    The Maya Bennett homepage: a large serif headline reading Most people start
