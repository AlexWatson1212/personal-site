    beneath it, and a row giving who she works with, the fee and the location.
    To the right, a quoted worry — I'm not sure this counts — with the answer
    set directly under it.
  swatches: ["#F7F2E6", "#DED6EC", "#EF7F4B", "#4A2340"]

