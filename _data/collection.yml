# The website collection.
#
# One entry per design direction. Everything a direction needs — its palette,
# its typographic behaviour, its layout personality and its metadata — is held
# here, and _includes/plate.html draws it. Adding a direction is adding an
# entry; nothing in the templates changes.
#
# `variant` selects the layout personality in studio.css (§09):
#   warm | editorial | care | balance | choice | clinical | community | direct
# `foot` selects what sits below the hero: strip | routes | index

- ref: "01"
  key: rowan-hill
  name: Rowan Hill Therapy
  variant: warm
  practice: Solo therapist
  atmosphere: Quiet and unhurried
  note: >-
    Generous space, a natural palette and an unhurried route to enquiry. Made
    for a practitioner whose work is slow and relational, and whose website
    should not be in a hurry either.
  tags: [One therapist, Quiet, Unhurried]
  search: rowan hill solo therapist one therapist adults quiet unhurried warm gentle nature spacious calm
  paper: "#f3eee5"
  ink: "#1f3027"
  soft: "#75806d"
  accent: "#c88e72"
  word: Rowan Hill
  eyebrow: Room to arrive
  headline: Therapy with space to hear yourself think.
  foot: strip
  feature: true

- ref: "02"
  key: stillpoint
  name: Stillpoint
  variant: editorial
  practice: Solo therapist
  atmosphere: Precise and calm
  note: >-
    Architectural and precisely ordered, for a practitioner who wants to read
    as exact without reading as clinical. Rules, indices and a tight measure do
    the work that decoration usually does.
  tags: [One therapist, Precise, Ordered]
  search: stillpoint solo therapist one therapist adults quiet precise ordered structured measured exact minimal
  paper: "#f1efe9"
  ink: "#252a2d"
  soft: "#66727b"
  accent: "#b0604f"
  word: Stillpoint
  eyebrow: A measured practice
  headline: A quiet place to look at what is difficult.
  foot: strip

