# The collection: three flagship portfolio cases.
#
# SEPTEMBER 2026 (16th) — NARROWED FROM SIX TO THREE, DELIBERATELY.
# Sofia Marin, Maya Bennett and Daniel Mercer are the public collection. Helen
# Calder, Harbour and Stillpoint were removed from it as a strategic decision,
# not hidden temporarily: three cases are easier to understand, they carry the
# strongest work, and the fictional portfolio stops growing until real clients
# have been through the process. Their entries, case pages, documents and
# screenshots are preserved unpublished in
# _strategy/archived-portfolio-2026-09/, and their old URLs redirect to /work/
# (see _redirects). DECISION-REGISTER.md records the freeze: no new fictional
# practice is added here before real-client evidence exists.
#
# Until September 2026 this file held the exploratory design directions —
# drawings of websites rather than websites. They are retired to
# _strategy/retired-direction-collection-2026-09.yml (deleted since; recoverable from git history, see commit dd9eabc), which is never published.
#
# Each entry is a fictional practice with a finished concept website that is
# live, and the Practice Clarity Blueprint for it published beside it. The
# Blueprints were rewritten on 9 September 2026 in the form a practice reviews
# before design begins — labelled Established / Interpretation /
# Recommendation, and ending in an approval page — after the concept sites
# themselves had been built. Public copy must not claim they were written
# before the design. `pdf` points at the current one; the sources are in
# _strategy/, which is never published.
#
# The point of three is range, not quantity: the same method applied to three
# practices produces three answers with almost nothing in common. They are
# evidence, not choices: since 17 September 2026 the site no longer asks a client
# to pick one as a starting point (the contact form has no design field and the
# /work/ cards no "start from this one" link). A client may mention one they
# liked; it is never a template they buy.
#
# PROVENANCE. Every entry must carry a `provenance` value, and only the four
# in _data/provenance.yml are permitted. No page writes its own disclosure
# wording — the label is rendered from there and must match the notice on the
# concept site itself. `client` is reserved and stays unused until it is
# factually true. scripts/qa.mjs enforces the vocabulary and the reservation,
# and asserts that this file lists exactly the three flagships.
#
# Fields
#   ref          the number shown on the card
#   key          the anchor on /work/, and the id an inbound link may target
#   case         the case study route
#   href         the live concept website
#   pdf          the published strategic document
#   shot / alt   the approved screenshot and its description
#   distinction  the one strategic problem this case answers
#   note         what the practice is, and what the site does about it
#   swatches     paper, secondary, accent, ink — in that order
#   feature      full width on /work/. Set on the first entry only: with three
#                cards in a two-column grid, the first spans the width and the
#                other two sit beside each other beneath it.

- ref: "01"
  key: sofia-marin
  provenance: studio-fictional
  name: Sofia Marin
  case: /work/sofia-marin/
  href: https://sofia-marin-concept.alexanderwatson.co.uk/
  pdf: /assets/practice-clarity/practice-clarity-sofia-marin.pdf
  practice: Solo therapist
  atmosphere: Editorial and precise
  distinction: Therapy for people who are tired of being read accurately.
  note: >-
    A fictional integrative therapist in Brighton, for adults whose lives are
    working and no longer feel like theirs. The site describes nobody and hands
    them the method instead: one sentence that never changes, and the meanings
    underneath it that do.
  tags: [One therapist, Photographic, Aubergine]
  shot: /assets/images/work/sofia-marin-website.webp
  alt: >-
    The Sofia Marin homepage: a serif headline reading Therapy for adults, for
    the point at which a life stops fitting, a portrait beside it, and a row
    giving the fee, session length, working days and location.
  swatches: ["#F4EFE6", "#E9E0D2", "#6A2F4A", "#22132A"]
  feature: true

- ref: "02"
  key: maya-bennett
  provenance: studio-fictional
  name: Maya Bennett
  case: /work/maya-bennett/
