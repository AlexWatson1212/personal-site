- ref: "04"
  key: common-ground
  name: Common Ground
  variant: balance
  practice: Family service
  atmosphere: Even-handed
  note: >-
    Symmetrical by design, because the work is. Nothing on the page is raised
    above anything else, which is what lets it hold two sides of a difficult
    situation without appearing to take one.
