# ─────────────────────────────────────────────────────────────────────────────
# Practice Identity & Website — purchasing configuration (committed, safe defaults)
#
# This file contains NO secrets and NO Payment Link. It holds the prices the
# site displays and the URLs the purchase journey links to.
#
# The Payment Link and the on/off switch are resolved at build time from
# environment variables by scripts/purchasing-config.mjs, which writes
# _data/purchasing_resolved.yml. That generated file is never committed.
#
# If _data/purchasing_resolved.yml is absent, online purchasing is OFF and the
# page falls back to the "Ask a question first" route. That is the safe state.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# SEPTEMBER 2026 — THE FOUNDING PRACTICES
#
# The fields below describe ONE product at the price it is being sold at TODAY.
# Today that is the founding price, because the first three real practices are
# £495 rather than £995.
#
# This is not a tier, a stripped-down version, a trial or a discount. It is the
# whole service — the intake, the full 11-page Practice Fundamentals, the
# identity, the copy, one complete responsive page with its contact route, two
# feedback stages, domain connection, launch and the first twelve months of
# Practice Care — at a deliberately reduced price for the first three live client implementations of
# a process that has been built but not yet run with a real therapist. What the
# studio receives in exchange is the experience of running it, the feedback, and
# case studies and testimonials where the client is willing.
#
# Because there is one product, `price_display` and its instalments mean "what a
# client pays if they say yes today". Every template renders those fields and
# no template writes its own figure, so closing the offer is one edit here.
#
# WHEN THE THIRD FOUNDING PRACTICE HAS PAID ITS FIRST INSTALMENT:
#   1. set founding.active: false
#   2. set price_display "£995", price_numeric "995.00"
#   3. set deposit_display / balance_display to the standard schedule, with
#      their numerics, and rewrite payment_sentence and
#      payment_sentence_third_person to match. The standard schedule keeps the
#      same shape as the founding one — a sum to begin, and the rest once the
#      Practice Fundamentals has been approved, before the build. The exact
#      figures are recorded in OPEN_DECISIONS.md item 3 and
#      docs/founding-practices.md §2; they are not written here because every
#      amount in this file is scanned as a live price, and the suite's price list
#      (scripts/qa.mjs APPROVED_PRICES) must be extended in the same commit.
#      The founding deposit belongs to the founding arrangement and does not
#      survive it: a later client is not carrying the uncertainty it answers.
#   4. remove the founding sections from index.html and service.html, which are
#      wrapped in {% if site.data.purchasing.founding.active %} for that purpose
#   5. run `npm test` — the suite asserts the two states are internally
#      consistent and will name anything left behind
#
# NO COUNTDOWN, NO DEADLINE, NO REMAINING-PLACES COUNTER. The truthful
# constraint is that there are three places. A number that ticks down is a sales
# device and would have to be maintained by hand to stay honest, so the site
# does not carry one. When the places are gone the price on the page changes.
# ─────────────────────────────────────────────────────────────────────────────

founding:
  active: true
  places: 3
  # The standard price the service returns to. Published so a reader can see
  # what they are being offered against, never struck through and never used to
  # make £495 look like a saving.
  standard_price_display: "£995"
  standard_price_numeric: "995.00"
  # The canonical one-sentence account of why the price is what it is. Pages may
  # expand on it; none may contradict it.
  sentence: >-
    The first three practices are £495 rather than the standard £995, because
    they are the first three times the whole process runs with a real therapist
    and what I learn from them is worth the difference.
  # Why the founding instalments are weighted the way they are. Stated once here,
  # so that no page invents its own account of it.
  payment_note: >-
    Most of it falls due once you have seen and approved your Practice
    Fundamentals, rather than at the start. The founding three are taking on more
    uncertainty than a later client will, so the larger part of the fee waits
    until there is a finished direction to look at.

# THE CANONICAL PAYMENT SENTENCE lives here and nowhere else. Every page that
# states the payment terms renders `payment_sentence`; no page writes its own
# formulation. Three formulations were in circulation before August 2026 and
# they contradicted each other, which is the whole reason this field exists.
#
# The balance is triggered by the client's explicit written approval of the
# direction — the Practice Fundamentals and visual direction, at the end of the
# first feedback stage — never by the studio declaring the work finished. The
# build begins only once the balance has been received. A single payment is not
# offered publicly; it may be agreed case by case in writing.
#
# 17 SEPTEMBER 2026 — THE PRACTICE FUNDAMENTALS INTAKE SYSTEM.
#
# Until this date the balance fell due when the finished website was approved
# for launch. It now falls due when the client approves the direction, before
# the build, because that is the point at which the client's commitment actually
# changes: they have seen the complete Practice Fundamentals, including a working
# preview of the website's opening screen, and chosen to go ahead. The founding
# split is still £100 to begin and £395 after that approval.
#
# The reason for the weighting is unchanged: £495 is already a meaningful amount
# for a therapist to risk with a studio that has no real-client case studies
# yet, so most of the fee should not sit with the studio before there is
# finished work to judge. The deposit is not meant to be income. It is the
# smallest sum that establishes genuine commitment on both sides so that the
# intake and the Practice Fundamentals can begin. docs/operations/
# practice-fundamentals-intake-system.md records the accepted risk: the deposit
# does not cover the Fundamentals work if a client withdraws after receiving it.
#
# WHAT THIS IS NOT, AND MUST NEVER BE DESCRIBED AS. Not "pay nothing until
# you're happy", not "no risk", not "risk-free", not a satisfaction guarantee,
# not money-back, not "only pay if you like it". The milestone is a written
# decision with a defined meaning — approving the direction, or confirming the
# adjusted direction after one consolidated set of adjustments — and clause 3 and
# clause 11 of the service terms say what it means. scripts/qa.mjs fails the
# build on the formulations above.
#
# The standard split is NOT published while the founding price is live: it would
# put a second £495 on the page meaning something entirely different, and one
# number meaning two things is the kind of detail that costs a reader their
# confidence.
price_display: "£495"
price_numeric: "495.00"
currency: "GBP"

deposit_display: "£100"
deposit_numeric: "100.00"
balance_display: "£395"
balance_numeric: "395.00"
payment_sentence: "£100 to reserve your place. £395 once you approve your Practice Fundamentals, before the website is built."
payment_sentence_third_person: "£100 to reserve the place. £395 once the client approves the Practice Fundamentals, before the build."

# THE PRACTICE FUNDAMENTALS HAS NO PRICE, AND MUST NOT ACQUIRE ONE.
#
# 17 September 2026. The deliverable that used to be called the Practice Clarity
# document is now the Practice Fundamentals: an 11-page document, produced from
# a controlled template, holding the practice's position, practical facts,
# beliefs and boundaries, descriptions at several lengths, voice and vocabulary,
# logo or wordmark, colours, typography, photography direction and a quick check
# for anything written later, plus a working preview of the website's opening
# screen. It is inside the price and is never sold, tiered or shortened for the
# founding clients. `clarity_display` was deleted rather than set to nothing, so
# that a template referring to it fails loudly; do not add a price field for the
# Fundamentals under any name.
#
# "Practice Clarity" now names only the method's nine published principles and
# the three published portfolio documents (the Blueprints). It no longer names
# anything a client receives.
#
# THE PUBLIC JOURNEY is six steps and one piece of work: enquire, reserve the
# project, complete the intake, approve the direction, website build, review and
# launch. There are two consolidated feedback stages — the Practice Fundamentals
# and visual direction; then the built website. Corrections (factual errors,
# anything misunderstood, anything that departs from the approved direction)
# never use up a stage.
#
# THE SCOPE is one complete responsive page — with an enquiry form and a reading
# control for text size and spacing — the full Practice Fundamentals, the
# identity (logo or wordmark, colours, typography, photography direction), the
# copy, the contact route, domain connection, launch and the first year of
# Practice Care. Additional pages, booking systems, blogs, advanced
# integrations, unusual functionality, print design, social-media templates,
# ongoing marketing and a change to a new direction after approval are quoted
# separately. Nothing may present any of this as separately priced.

# PRACTICE CARE (24 September 2026). Replaces Website Care.
#
# RETIRED: Website Care at a monthly fee after the included year. It is no
# longer offered, and no published page may mention it; scripts/qa.mjs fails
# the build if the old name or its monthly figure comes back.
#
# The first twelve months are included in the price and are not separately
# payable. After that Practice Care is OPTIONAL at `annual` a year, paid for the
# year ahead and renewed only when the client says yes. No recurring billing has
# been built and none is planned. Care is invoiced.
#
# Practice Care covers: hosting on the studio's infrastructure, the TLS
# certificate, security and technical upkeep, version history, DNS help, genuine
# technical faults, support with the website as built, and once a year a review
# of the website, directory profile and basic SEO health with a short set of
# written recommendations. It does NOT include development time, content or
# design changes, new pages, ongoing SEO, paid advertising or unlimited support.
# Those are additional work at `hourly_rate` (below), or a fixed quote where the
# scope is clear. The service page, the scope page, /terms/ and clause 12 of the
# service terms must agree.
#
# `annual` is the ONLY place the Practice Care figure is written; every page
# renders it, and scripts/qa.mjs approves it from here.
practice_care:
  included_months: 12
  annual: "£120"
  subscriptions_enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# OTHER SERVICES — THE HOURLY RATE (24 September 2026)
#
# The rate for smaller, ad hoc work on /other-services/. This is the ONLY place
# it is written. Set it as one amount with the pound sign and no "/hour" —
# the page adds "an hour" itself.
#
# While it reads "£XX" (or is empty) the page does not show a figure; it says
# the rate is confirmed before work starts, so the placeholder never reaches a
# visitor. scripts/qa.mjs reads the amount from here and approves it, so no
# other file needs to change when it is set.
#
# It is also the rate for additional work after launch, outside Practice Care.
# It is not a price for the Practice Identity & Website and must never be used
# to break that service into hours.
# ─────────────────────────────────────────────────────────────────────────────
hourly_rate: "£55"

# Routes the purchase journey depends on.
urls:
  service: "/services/practice-website/"
  # The private intake page (unlisted, noindex) and the printable photography
  # brief. Neither is linked from any public page.
  intake: "/client/intake/"
  photography: "/client/photography/"
  service_terms: "/service-terms/practice-website/"
  cancellation: "/cancellation-and-refunds/"
  privacy: "/privacy/"
  terms: "/terms/"
  enquiry: "/contact/?service=practice-website"

# Studio contact route used on the purchase-complete page.
support_email: "hello@alexanderwatson.co.uk"
