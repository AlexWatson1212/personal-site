# ─────────────────────────────────────────────────────────────────────────────
# Therapist Website — purchasing configuration (committed, safe defaults)
#
# This file contains NO secrets and NO Payment Link. It holds the prices the
# site displays and the URLs the purchase journey links to.
#
# The Payment Link and the on/off switch are resolved at build time from
# environment variables by scripts/purchasing-config.mjs, which writes
# _data/purchasing_resolved.yml. That generated file is never committed.
#
# If _data/purchasing_resolved.yml is absent, online purchasing is OFF and the
# page falls back to the "Ask a question first" route. That is the safe state.
# ─────────────────────────────────────────────────────────────────────────────

# The Therapist Website. One price, taken in two instalments.
#
# THE CANONICAL PAYMENT SENTENCE lives here and nowhere else. Every page that
# states the payment terms renders `payment_sentence`; no page writes its own
# formulation. Three formulations were in circulation before August 2026 and
# they contradicted each other, which is the whole reason this field exists.
#
# The balance is triggered by the client's explicit written approval of the
# finished website, never by the studio declaring the work finished. A single
# payment is not offered publicly; it may be agreed case by case in writing.
price_display: "£995"
price_numeric: "995.00"
currency: "GBP"

deposit_display: "£500"
deposit_numeric: "500.00"
balance_display: "£495"
balance_numeric: "495.00"
payment_sentence: "£500 to begin. £495 when you approve the finished website, before it goes live."
payment_sentence_third_person: "£500 to begin. £495 when the client approves the finished website, before it goes live."

# PRACTICE CLARITY HAS NO PRICE, AND MUST NOT ACQUIRE ONE.
#
# Until September 2026 it was an optional +£500 taken before the build. That
# made the client responsible for judging how much strategic work their own
# website needed, which is the one judgement they are least able to make and the
# one they are paying for. The work is now inside the £995: every website
# includes as much understanding as it needs, and how much that is is the
# studio's call, not a purchase decision.
#
# `clarity_display` was deleted rather than set to nothing, so that a template
# referring to it fails loudly instead of rendering an empty price. Do not add
# it back, and do not add tiers — Practice Clarity Lite, Full, Discovery or
# Strategy — under any name. There is one website offer.
#
# The name still means two true things: the method, and the six published
# portfolio documents that show it in unusually full form.

# Website Care. The first twelve months are included in the £995 and are not
# separately payable. After that it is optional and monthly.
#
# No subscription product, Payment Link or recurring checkout has been built
# or activated. Adding one needs verified Stripe webhooks, a record of who is
# subscribed, dunning and cancellation handling, and its own terms.
website_care:
  included_months: 12
  monthly: "£29"
  subscriptions_enabled: false

# Routes the purchase journey depends on.
urls:
  service: "/services/practice-website/"
  questionnaire: "/services/practice-website/questionnaire/"
  service_terms: "/service-terms/practice-website/"
  cancellation: "/cancellation-and-refunds/"
  privacy: "/privacy/"
  terms: "/terms/"
  purchase_complete: "/purchase-complete/"
  enquiry: "/contact/?service=practice-website"

# Studio contact route used on the purchase-complete page.
support_email: "hello@alexanderwatson.co.uk"
