# The three stages of the Practice Clarity pathway. Each holds three of the
# nine principles, in featured_order.
stages:
  - title: Understand what the practice already communicates
    note: Before promoting the work, notice what somebody encounters and what helps them stay.
  - title: Express it in a way the right person recognises
    note: Make the work understandable and recognisably yours without turning it into a performance.
  - title: Connect the experience so the next step feels clear
    note: Remove unnecessary complexity between a first impression and a genuine enquiry.
