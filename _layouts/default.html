<!doctype html>
<html lang="en">
<head>
  {% include head.html %}
</head>

<body>
  {% include header.html %}

  <main id="content" class="site-content">
    {{ content }}
  </main>

  {% include footer.html %}

  {% if site.google_analytics %}
    {% include analytics.html %}
  {% endif %}

  <script src="{{ '/assets/js/nav.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {% if page.url == '/service/' %}
    <script src="{{ '/assets/js/service-documents.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {% endif %}
</body>
</html>
