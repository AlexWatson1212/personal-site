---
layout: default
---

<section class="band band--sm on-paper">
  <div class="wrap--mid">
    <header class="article-hero" style="padding-block-start:0">
      <p class="label">{{ page.kicker | default: "Alexander Watson Studio" }}</p>
      <h1 class="t-h1">{{ page.title }}</h1>
      {% if page.description %}<p class="lead mt-5 measure-xl">{{ page.description }}</p>{% endif %}
    </header>
    <div class="prose">{{ content }}</div>
  </div>
</section>
